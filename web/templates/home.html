<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Home Page</title>
	<meta name="viewport" content="width=device.width" />
	<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
	<h1>Welcome to My ToDo List!</h1>

    <section>
        <h2>Tasks</h2>
        <ul>
        {{ range . }}
            <li>
                {{ .Title }} : {{ .Description }}
                <a href="/edit/?id={{.ID}}">Edit</a>
                <a href="/delete/?id={{.ID}}">Delete</a>
            </li>
        {{ end }}
        </ul>
    </section>

    <section>
        <h2>Create Task</h2>
        <form method="GET">
            <div>
                <label for="ftitle"> Title: </label>
                <input type="text" id="ftitle" name="ftitle" required>
            </div>
            <br>
            <div>
                <label for="fdescription"> Description: </label>
                <input type="text" id="fdescription" name="fdescription" required>
            </div>

            <br>
            <div>
                <input type = "submit">
            </div>
        </form>
    </section>
</body>
</html>
