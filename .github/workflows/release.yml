name: CD Pipeline Release
on:
  push:
    branches: [main]

permissions:
  contents: read

# Two quick merges must not both compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read bump from merged PR label
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bump=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --jq '[.[0].labels[].name | ascii_downcase | select(. == "major" or . == "minor" or . == "patch")][0] // empty')
          if [ -z "$bump" ]; then
            echo "::error::The merged PR has no major, minor or patch label"
            exit 1
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        run: echo "version=$(.github/scripts/next-version.sh ${{ steps.bump.outputs.bump }})" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Push
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/e-voch/todo-list-with-a-twist
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t "$IMAGE:${{ needs.version.outputs.version }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

  # Release last, so a failed build doesn't leave a version with no image.
  # Creating the release also creates the tag.
  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "v${{ needs.version.outputs.version }}" \
            --generate-notes
